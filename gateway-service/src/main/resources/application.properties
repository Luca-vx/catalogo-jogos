spring.application.name=gateway-service
server.port=8080

# URLs dos serviços internos (ocultos do cliente externo)
servicos.catalogo.url=http://localhost:8081
servicos.avaliacoes.url=http://localhost:8082
servicos.loja.url=http://localhost:8083

resilience4j.retry.instances.lojaRetry.maxAttempts=3
resilience4j.retry.instances.lojaRetry.waitDuration=500ms
resilience4j.retry.instances.lojaRetry.ignoreExceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.instances.lojaBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.lojaBreaker.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.lojaBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.lojaBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.lojaBreaker.permittedNumberOfCallsInHalfOpenState=2

resilience4j.retry.instances.avaliacoesRetry.maxAttempts=3
resilience4j.retry.instances.avaliacoesRetry.waitDuration=500ms
resilience4j.retry.instances.avaliacoesRetry.ignoreExceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.instances.avaliacoesBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.avaliacoesBreaker.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.avaliacoesBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.avaliacoesBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.avaliacoesBreaker.permittedNumberOfCallsInHalfOpenState=2

resilience4j.retry.instances.catalogoRetry.maxAttempts=3
resilience4j.retry.instances.catalogoRetry.waitDuration=500ms
resilience4j.retry.instances.catalogoRetry.ignoreExceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.instances.catalogoBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.catalogoBreaker.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.catalogoBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.catalogoBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.catalogoBreaker.permittedNumberOfCallsInHalfOpenState=2

